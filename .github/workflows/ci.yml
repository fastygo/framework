name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  framework:
    name: framework / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Disable workspace
        run: echo "GOWORK=off" >> $GITHUB_ENV

      - name: Download dependencies
        run: go mod download

      - name: golangci-lint
        # v9 is the first action major that ships golangci-lint v2 by default.
        # v2.4+ is required for Go 1.25 (older binaries are built with Go 1.24).
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
