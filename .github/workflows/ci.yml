name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  framework:
    name: framework / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Disable workspace
        run: echo "GOWORK=off" >> $GITHUB_ENV

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...
